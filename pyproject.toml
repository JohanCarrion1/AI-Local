[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "AI-Local-Hub"
version = "0.1.0"
description = "Aplicación local para gestionar, descargar y ejecutar modelos de IA"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "JohanCarrion1", email = "johan@example.com"}
]
keywords = ["AI", "LLM", "Local", "Model Management", "GitHub Integration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "PyGithub>=2.0.0",
    "gitpython>=3.1.0",
    "huggingface_hub>=0.19.0",
    "transformers>=4.37.0",
    "torch>=2.0.0",
    "accelerate>=0.25.0",
    "Pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "streamlit>=1.29.0",
    "psutil>=5.9.0",
    "keyring>=24.0.0",
    "cryptography>=41.0.0",
    "requests>=2.31.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "anyio>=4.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
ailocal = "app.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
