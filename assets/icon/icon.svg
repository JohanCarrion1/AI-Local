<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Fondo -->
  <rect width="200" height="200" rx="30" fill="#1e293b"/>
  
  <!-- Pantalla de móvil (fondo) -->
  <rect x="50" y="20" width="100" height="160" rx="10" fill="#3b82f6" stroke="#ffffff" stroke-width="2"/>
  
  <!-- Botón de inicio (móvil) -->
  <circle cx="100" cy="170" r="5" fill="#ffffff"/>
  
  <!-- Líneas de código en la pantalla -->
  <path d="M60 50 L140 50" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M60 70 L140 70" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M60 90 L120 90" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M60 110 L140 110" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  <path d="M60 130 L100 130" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
  
  <!-- Icono de IA (cerebro) -->
  <path d="M70 30 Q100 15 130 30 Q100 45 70 30" fill="none" stroke="#ffffff" stroke-width="2"/>
  <path d="M75 35 Q100 25 125 35 Q100 40 75 35" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M80 40 Q100 30 120 40 Q100 35 80 40" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  
  <!-- Ojo (visión por computadora) -->
  <circle cx="100" cy="80" r="8" fill="none" stroke="#ffffff" stroke-width="2"/>
  <circle cx="100" cy="80" r="3" fill="#ffffff"/>
  
  <!-- Texto -->
  <text x="100" y="190" font-size="12" fill="#ffffff" text-anchor="middle" font-family="Arial">AI Local Hub</text>
  
  <!-- Efecto de brillo -->
  <path d="M60 40 Q100 20 140 40" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.3"/>
</svg>
