name: Android APK Build
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Validate catalog and frontend
        run: |
          python3 android/check_catalog.py
          node --check android/app/src/main/assets/app.js
      - name: Build native engine and APK
        run: ./android/gradlew -p android --no-daemon --max-workers=2 testDebugUnitTest assembleDebug lintDebug
      - name: Require a real installable artifact
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep libailocal.so
      - uses: actions/upload-artifact@v4
        with:
          name: ai-local-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
  interface-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps chromium
      - run: python android/tests/ui_smoke.py

  android-insets-test:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build emulator test APKs
        run: ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Download and verify engineering inference fixture
        run: |
          python3 - <<'PY'
          import hashlib, json, os, time, urllib.request
          from pathlib import Path
          catalog = json.loads(Path('android/app/src/main/assets/models.json').read_text())
          fixture = next(m for m in catalog if m['id'] == 'qwen05')['files'][0]
          digest = hashlib.sha256()
          path = Path(os.environ['RUNNER_TEMP']) / 'inference-fixture.gguf'
          url = fixture['url'] + '?download=true&ci=' + str(time.time_ns())
          with urllib.request.urlopen(url, timeout=120) as response, path.open('wb') as out:
              while chunk := response.read(8 * 1024 * 1024):
                  out.write(chunk)
                  digest.update(chunk)
          assert path.stat().st_size == fixture['size']
          assert digest.hexdigest() == fixture['sha256']
          print('Verified pinned GGUF for the real Android inference integration test')
          PY
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 installDebug
            adb shell run-as com.ailocal.app mkdir -p files
            adb shell 'run-as com.ailocal.app sh -c "cat > files/inference-fixture.gguf"' < "$RUNNER_TEMP/inference-fixture.gguf"
            ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-insets-test-results
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore
