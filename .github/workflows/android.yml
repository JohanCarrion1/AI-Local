name: Android APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Cache Buildozer
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.cache
        key: buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          buildozer-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install buildozer==1.5.0 kivy==2.2.1 cython
    
    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Install Android SDK and NDK
      run: |
        # Install Android SDK tools
        mkdir -p ~/android-sdk/cmdline-tools/latest
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-10406996_latest.zip -O sdk-tools.zip
        unzip -q sdk-tools.zip -d ~/android-sdk/cmdline-tools/latest
        rm sdk-tools.zip
        
        # Set environment
        echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/android-sdk" >> $GITHUB_ENV
        echo "ANDROID_NDK_ROOT=$HOME/android-sdk/ndk" >> $GITHUB_ENV
        echo "PATH=$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/platform-tools:$PATH" >> $GITHUB_ENV
        
        # Accept licenses
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        echo "count=0" > ~/.android/repositories.cfg
        yes | sdkmanager --licenses > /dev/null 2>&1 || true
        
        # Install packages
        sdkmanager --install "platform-tools" > /dev/null 2>&1 || true
        sdkmanager --install "platforms;android-30" > /dev/null 2>&1 || true
        sdkmanager --install "build-tools;30.0.3" > /dev/null 2>&1 || true
    
    - name: Download NDK
      run: |
        wget -q https://dl.google.com/android/repository/android-ndk-r23b-linux.zip -O ndk.zip
        unzip -q ndk.zip -d ~/android-sdk
        rm ndk.zip
        echo "ANDROID_NDK_HOME=$HOME/android-sdk/android-ndk-r23b" >> $GITHUB_ENV
    
    - name: Build APK
      run: |
        cd $GITHUB_WORKSPACE
        
        # Build with limited output
        buildozer android debug 2>&1 | tail -50
      timeout-minutes: 150
      env:
        BUILDOZER_WARN_ON_ROOT: 0
    
    - name: Upload APK artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ai-local-gallery-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Upload build directory
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-build
        path: .buildozer/
        retention-days: 7
