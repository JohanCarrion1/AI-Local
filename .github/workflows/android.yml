name: Android APK Build
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Validate catalog and frontend
        run: |
          python3 android/check_catalog.py
          node --check android/app/src/main/assets/app.js
      - name: Build native engine and APK
        run: ./android/gradlew -p android --no-daemon --max-workers=2 testDebugUnitTest assembleDebug lintDebug
      - name: Require the complete optimized native engine
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PYAPK'
          import zipfile
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              libs = {name.split('/')[-1] for name in apk.namelist() if name.startswith('lib/arm64-v8a/')}
              required = {'libailocal.so', 'libllama.so', 'libmtmd.so', 'libggml.so', 'libggml-base.so', 'libc++_shared.so'}
              required |= {'libggml-cpu-' + arch + '.so' for arch in ['android_armv8.0_1', 'android_armv8.2_1', 'android_armv8.2_2', 'android_armv8.6_1']}
              assert required <= libs, f'Missing native dependencies: {required - libs}'
              print('Verified bundled native engine:', ', '.join(sorted(libs)))
          PYAPK
      - uses: actions/upload-artifact@v4
        with:
          name: ai-local-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports (only when the build fails)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
  interface-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps chromium
      - run: python android/tests/ui_smoke.py

  android-insets-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Build emulator test APKs
        run: ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 assembleDebug assembleDebugAndroidTest
      - name: Download verified inference and vision fixtures
        run: python3 android/tests/download_fixtures.py "$RUNNER_TEMP/auren-fixtures" qwen05 smol
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 installDebug
            adb shell pm grant com.ailocal.app android.permission.POST_NOTIFICATIONS
            adb shell run-as com.ailocal.app mkdir -p files
            adb shell 'run-as com.ailocal.app sh -c "cat > files/inference-fixture.gguf"' < "$RUNNER_TEMP/auren-fixtures/qwen05-0.gguf"
            adb shell 'run-as com.ailocal.app sh -c "cat > files/smol-0.gguf"' < "$RUNNER_TEMP/auren-fixtures/smol-0.gguf"
            adb shell 'run-as com.ailocal.app sh -c "cat > files/smol-1.gguf"' < "$RUNNER_TEMP/auren-fixtures/smol-1.gguf"
            ./android/gradlew -p android --no-daemon --max-workers=2 -PtestAbi=x86_64 connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: android-insets-test-results
          path: android/app/build/reports/androidTests/
          if-no-files-found: ignore

  arm64-mobile-models:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [qwenvl3, qwen3vl4, minicpm4, qwen3-instruct4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build dispatched ARM64 engine
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S android/tests/native -B build/native -DCMAKE_BUILD_TYPE=Release
          cmake --build build/native -j 4
          mkdir -p build/classes
          javac -d build/classes android/app/src/main/java/com/ailocal/app/Engine.java android/tests/native/VisionRegression.java android/tests/native/CodeRegression.java android/tests/native/WindowRegression.java
      - name: Download verified full mobile model
        run: python3 android/tests/download_fixtures.py "$RUNNER_TEMP/auren-fixtures" "${{ matrix.model }}"
      - name: Verify actual vision pixels or generated code on ARM64
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build/native/bin
          MODEL: ${{ matrix.model }}
        run: |
          set -o pipefail
          if [ "$MODEL" = qwen3-instruct4 ]; then
            java -Djava.library.path=build/native/bin -cp build/classes com.ailocal.app.CodeRegression "$RUNNER_TEMP/auren-fixtures/$MODEL-0.gguf" "$PWD/build/native/bin" generated.py 2>&1 | tee "$MODEL.log"
            python3 android/tests/validate_generated_code.py generated.py
            java -Djava.library.path=build/native/bin -cp build/classes com.ailocal.app.WindowRegression "$RUNNER_TEMP/auren-fixtures/$MODEL-0.gguf" "$PWD/build/native/bin" 2>&1 | tee -a "$MODEL.log"
          else
            java -Djava.library.path=build/native/bin -cp build/classes com.ailocal.app.VisionRegression "$RUNNER_TEMP/auren-fixtures/$MODEL-0.gguf" "$RUNNER_TEMP/auren-fixtures/$MODEL-1.gguf" "$PWD/build/native/bin" 2>&1 | tee "$MODEL.log"
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: mobile-${{ matrix.model }}-results
          path: |
            ${{ matrix.model }}.log
            generated.py
          if-no-files-found: ignore
