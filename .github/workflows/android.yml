name: Android APK Build
on:
  push:
    branches: [main, 'codex/**']
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install pinned native toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.0.13004108' 'cmake;3.22.1'
      - name: Validate catalog and frontend
        run: |
          python3 android/check_catalog.py
          node --check android/app/src/main/assets/app.js
      - name: Build native engine and APK
        run: ./android/gradlew -p android --no-daemon --max-workers=2 assembleDebug lintDebug
      - name: Require a real installable artifact
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l android/app/build/outputs/apk/debug/app-debug.apk | grep libailocal.so
      - uses: actions/upload-artifact@v4
        with:
          name: ai-local-android-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
  interface-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install playwright==1.58.0
      - run: playwright install --with-deps chromium
      - run: python android/tests/ui_smoke.py
