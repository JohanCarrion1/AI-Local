name: resolve-models-temp
# TEMPORAL: consulta Hugging Face y publica tamaños/SHA-256/commits como anotaciones.
# Se elimina antes de fusionar.
on:
  push:
    branches: [feat/modelos-pequenos]
    paths: [.github/workflows/resolve-models-temp.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve candidates
        run: |
          python3 - <<'PY'
          import json, re, urllib.request, urllib.error

          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "auren-catalog-resolver"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def info(repo):
              try:
                  return get(f"https://huggingface.co/api/models/{repo}?blobs=true")
              except urllib.error.HTTPError as e:
                  print(f"  {repo}: HTTP {e.code}")
              except Exception as e:
                  print(f"  {repo}: {e!r}")
              return None

          def kv(repos):
              for repo in repos:
                  try:
                      c = get(f"https://huggingface.co/{repo}/resolve/main/config.json")
                  except Exception as e:
                      print(f"  config {repo}: {e!r}")
                      continue
                  t = c.get("text_config", c)
                  layers = t["num_hidden_layers"]
                  heads = t["num_attention_heads"]
                  kvh = t.get("num_key_value_heads") or heads
                  dim = t.get("head_dim") or t["hidden_size"] // heads
                  return {"from": repo, "layers": layers, "kvHeads": kvh, "headDim": dim,
                          "model_type": t.get("model_type"), "value": 2 * layers * kvh * dim}
              return None

          def ggufs(d):
              return [s for s in d.get("siblings", []) if s["rfilename"].lower().endswith(".gguf")]

          def asset(repo, rev, s):
              lfs = s.get("lfs") or {}
              return {"file": s["rfilename"], "size": lfs.get("size", s.get("size")),
                      "sha256": lfs.get("sha256"),
                      "url": f"https://huggingface.co/{repo}/resolve/{rev}/{s['rfilename']}"}

          def pick_main(files):
              ok = [s for s in files if "mmproj" not in s["rfilename"].lower()
                    and re.search(r"q4_k_m\.gguf$", s["rfilename"], re.I)
                    and not re.search(r"-\d{5}-of-\d{5}", s["rfilename"])]
              return ok[0] if ok else None

          def pick_proj(files):
              p = [s for s in files if "mmproj" in s["rfilename"].lower()]
              for pat in (r"q8_0", r"f16"):
                  for s in p:
                      if re.search(pat, s["rfilename"], re.I):
                          return s
              return None

          Q3 = "Qwen3-VL-{n}-Instruct"
          C = [
              dict(id="qwen3vl2", vision=True, arch="Qwen/Qwen3-VL-2B-Instruct",
                   repos=["Qwen/Qwen3-VL-2B-Instruct-GGUF", "unsloth/Qwen3-VL-2B-Instruct-GGUF",
                          "ggml-org/Qwen3-VL-2B-Instruct-GGUF", "bartowski/Qwen_Qwen3-VL-2B-Instruct-GGUF"],
                   cfg=["Qwen/Qwen3-VL-2B-Instruct"]),
              dict(id="qwen3vl4", vision=True, arch="Qwen/Qwen3-VL-4B-Instruct",
                   repos=["Qwen/Qwen3-VL-4B-Instruct-GGUF", "unsloth/Qwen3-VL-4B-Instruct-GGUF",
                          "ggml-org/Qwen3-VL-4B-Instruct-GGUF", "bartowski/Qwen_Qwen3-VL-4B-Instruct-GGUF"],
                   cfg=["Qwen/Qwen3-VL-4B-Instruct"]),
              dict(id="qwen3i4", vision=False, arch="Qwen/Qwen3-4B-Instruct-2507",
                   repos=["Qwen/Qwen3-4B-Instruct-2507-GGUF", "unsloth/Qwen3-4B-Instruct-2507-GGUF",
                          "bartowski/Qwen_Qwen3-4B-Instruct-2507-GGUF",
                          "lmstudio-community/Qwen3-4B-Instruct-2507-GGUF"],
                   cfg=["Qwen/Qwen3-4B-Instruct-2507"]),
              dict(id="gemma3-4", vision=True, arch="google/gemma-3-4b-it",
                   repos=["ggml-org/gemma-3-4b-it-GGUF", "unsloth/gemma-3-4b-it-GGUF"],
                   cfg=["unsloth/gemma-3-4b-it", "google/gemma-3-4b-it"]),
              dict(id="llama32-3", vision=False, arch="meta-llama/Llama-3.2-3B-Instruct",
                   repos=["bartowski/Llama-3.2-3B-Instruct-GGUF", "unsloth/Llama-3.2-3B-Instruct-GGUF",
                          "lmstudio-community/Llama-3.2-3B-Instruct-GGUF"],
                   cfg=["unsloth/Llama-3.2-3B-Instruct", "meta-llama/Llama-3.2-3B-Instruct"]),
          ]

          for c in C:
              print(f"== {c['id']}")
              out = None
              for repo in c["repos"]:
                  d = info(repo)
                  if not d:
                      continue
                  files = ggufs(d)
                  print(f"  {repo} rev={d.get('sha')} gated={d.get('gated')}")
                  for s in files:
                      lfs = s.get("lfs") or {}
                      print(f"     {s['rfilename']}  {lfs.get('size', s.get('size'))}")
                  main = pick_main(files)
                  proj = pick_proj(files) if c["vision"] else None
                  if main and (proj or not c["vision"]) and out is None:
                      out = {"id": c["id"], "repo": repo, "revision": d["sha"],
                             "architectureSource": c["arch"],
                             "files": [asset(repo, d["sha"], main)] + ([asset(repo, d["sha"], proj)] if proj else []),
                             "kv": kv(c["cfg"])}
              if out:
                  line = json.dumps(out, separators=(",", ":"))
                  print("RESOLVED " + line)
                  print("::notice title=RESOLVED " + c["id"] + "::" + line)
              else:
                  print(f"::warning title=UNRESOLVED {c['id']}::no repo with the needed files")
          PY
