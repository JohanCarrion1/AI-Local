name: resolve-models-temp
# TEMPORAL: consulta Hugging Face y publica tamaños/SHA-256/commits. Se elimina antes de fusionar.
on:
  push:
    branches: [feat/modelos-sin-censura]
    paths: [.github/workflows/resolve-models-temp.yml]
permissions:
  contents: read
jobs:
  resolve:
    runs-on: ubuntu-24.04
    steps:
      - name: Resolve candidates
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error
          def get(url):
              req = urllib.request.Request(url, headers={"User-Agent": "auren-catalog-resolver"})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)
          repos = ["bartowski/mlabonne_Qwen3-4B-abliterated-GGUF",
                   "bartowski/Dolphin3.0-Qwen2.5-3b-GGUF",
                   "bartowski/Llama-3.2-3B-Instruct-uncensored-GGUF",
                   "bartowski/Qwen2.5-Coder-7B-Instruct-abliterated-GGUF"]
          out = {}
          for repo in repos:
              try:
                  d = get(f"https://huggingface.co/api/models/{repo}?blobs=true")
              except Exception as e:
                  out[repo] = repr(e); continue
              files = [{"file": s["rfilename"], "size": s.get("size"), "sha256": (s.get("lfs") or {}).get("sha256")}
                       for s in d.get("siblings", []) if "Q4_K_M" in s["rfilename"] or "Q4_K_L" in s["rfilename"]]
              out[repo] = {"sha": d.get("sha"), "gated": d.get("gated"), "license": (d.get("cardData") or {}).get("license"),
                           "base": (d.get("cardData") or {}).get("base_model"), "files": files}
          print("RESULT_JSON_BEGIN"); print(json.dumps(out, indent=1)); print("RESULT_JSON_END")
          PY
