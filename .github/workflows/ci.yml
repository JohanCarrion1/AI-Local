name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest psutil gitpython requests keyring PyGithub
        pip install streamlit
        pip install huggingface_hub transformers accelerate Pillow opencv-python pydantic pydantic-settings anyio httpx
    
    - name: Check core imports
      run: |
        python -c "from app.core.resource_detector import ResourceDetector; print('ResourceDetector: OK')"
        python -c "from app.db.database import Database; print('Database: OK')"
        python -c "from app.core.github_connector import GitHubConnector; print('GitHubConnector: OK')"
        python -c "from app.core.model_manager import ModelManager; print('ModelManager: OK')"
        python -c "from app.core.executor import ModelExecutor; print('ModelExecutor: OK')"
        python -c "from app.gui.app import *; print('GUI: OK')"
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v
    
    - name: Check CLI syntax
      run: |
        python -m py_compile app/cli/main.py
    
    - name: Check GUI syntax
      run: |
        python -m py_compile app/gui/app.py
    
    - name: Check utils syntax
      run: |
        python -m py_compile app/utils/*.py
        python -m py_compile app/db/*.py

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Build package
      run: |
        pip install build
        python -m build --sdist --wheel
    
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ai-local-hub-package
        path: dist/*
        retention-days: 7

  success:
    needs: [test, build]
    runs-on: ubuntu-latest
    
    steps:
    - name: All checks passed
      run: echo "\u2705 All CI/CD checks passed successfully!"
