name: CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies for torch
      run: |
        sudo apt-get update
        sudo apt-get install -y libopenblas-dev
    
    - name: Install all dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest psutil gitpython requests keyring PyGithub torch --index-url https://download.pytorch.org/whl/cpu
    
    - name: Run tests
      run: |
        python -m pytest tests/ -v
    
    - name: Check imports
      run: |
        python -c "from app.core.resource_detector import ResourceDetector; print('ResourceDetector: OK')"
        python -c "from app.db.database import Database; print('Database: OK')"
        python -c "from app.core.github_connector import GitHubConnector; print('GitHubConnector: OK')"
        python -c "from app.core.model_manager import ModelManager; print('ModelManager: OK')"
        python -c "from app.core.executor import ModelExecutor; print('ModelExecutor: OK')"
    
    - name: Check syntax
      run: |
        python -m py_compile app/cli/main.py
        python -m py_compile app/gui/app.py
        python -m py_compile app/core/*.py
        python -m py_compile app/db/*.py
        python -m py_compile app/utils/*.py

  build:
    needs: test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Build package
      run: |
        pip install build
        python -m build --sdist --wheel
    
    - name: Upload artifact
      uses: actions/upload-artifact@v3
      with:
        name: ai-local-hub-package
        path: dist/*
        retention-days: 7

  success:
    needs: [test, build]
    runs-on: ubuntu-latest
    
    steps:
    - name: All checks passed
      run: echo "✅ All CI/CD checks passed successfully!"
